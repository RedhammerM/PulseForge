[project]
name = "physio-state"
version = "0.1.0"
description = "Garmin sync, workout import and analysis tables for the physiology project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "fitdecode>=0.10",
    "garmin-connect-personal-api-python==1.0.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.11",
]

[project.scripts]
physio-state = "physio_state.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physio_state"]
