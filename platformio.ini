; PlatformIO project for the Arduino Nano firmware (sources in firmware/).
; Build and upload from the repository root:  pio run -t upload

[platformio]
src_dir = firmware

[env:nanoatmega328]
platform = atmelavr
; Clone Nanos with the old bootloader need: board = nanoatmega328
board = nanoatmega328new
framework = arduino
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
; The stream is binary at 250000 baud; the serial monitor only shows the
; '#' status lines. Close it before running physio-daq (one program per port).
monitor_speed = 250000
