[project]
name = "physio-app"
version = "0.1.0"
description = "Streamlit dashboards for physio-daq recordings, Garmin data and daily logs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "physio-daq",
    "physio-state",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[project.scripts]
physio-app = "physio_app.launch:main"

[tool.uv.sources]
physio-daq = { workspace = true }
physio-state = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physio_app"]
